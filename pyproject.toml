[project]
name = "crypto-sentiment-btc"
version = "0.1.0"
description = "Crypto news sentiment vs. BTC price movement — hypothesis test"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
